[project]
name = "opensociety-api-fastapi"
version = "0.1.0"
description = "FastAPI migration scaffold for OpenSociety"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "firebase-admin>=6.8.0,<7.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "python-jose[cryptography]>=3.5.0,<4.0.0",
  "sqlalchemy>=2.0.42,<3.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "supabase>=2.17.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
